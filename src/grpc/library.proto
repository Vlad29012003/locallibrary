syntax = "proto3";

package com.example.grpc;

message HelloRequest {}


message Author {
    string first_name = 1;
    string last_name = 2;
    string date_of_birth = 3;
    string date_of_death = 4;
}

message Book {
    string title = 1;
    Author author = 2;
    string summary = 3;
    string isbn = 4;
    repeated string genre = 5; // массив жанолв
}

message BooksAuthorsRequest {
    repeated Book books = 1;
}

service LibraryService {

    rpc SendBooksAndAuthors (BooksAuthorsRequest) returns (HelloRequest);
}